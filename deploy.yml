name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate App & Build
        run: |
          if [ -f "./package.json" ]; then
            npm install
            npm run build
          elif [ -f "./multireligionvalsystem.multireligionvalsystem.eu.org.app/package.json" ]; then
            cd multireligionvalsystem.multireligionvalsystem.eu.org.app
            npm install
            npm run build
            mkdir -p ../dist
            cp -r dist/* ../dist/
          else
            PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            APP_DIR=$(dirname "$PACKAGE_PATH")
            cd "$APP_DIR"
            npm install
            npm run build
            mkdir -p ../dist
            cp -r dist/* ../dist/
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
